[project]
name = "support-triage"
version = "0.1.0"
description = "A support case triage agent: read a case, look up the account, ground a severity and an SLA commitment in policy, and propose an action a human approves."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
triage = "support_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_triage"]
